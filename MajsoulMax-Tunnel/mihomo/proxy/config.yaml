log-level: info
allow-lan: false
mixed-port: 12345
geodata-mode: true
find-process-mode: strict
keep-alive-interval: 15
client-fingerprint: random
profile:
  store-selected: true
  store-fake-ip: true
ntp:
  enable: true
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30
sniffer:
  enable: false
  sniff:
    TLS:
      ports:
        - "443"
        - "8443"
    HTTP:
      ports:
        - "80"
        - 8080-8880
      override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  skip-domain:
    - +.push.apple.com
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24
    - 2001:67c:4e8::/48
    - 2001:b28:f23c::/47
    - 2001:b28:f23f::/48
    - 2a0a:f280:203::/48
  force-domain: []
tun:
  enable: false
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  device: MajsoulMax-Tunnel
  mtu: 1500
dns:
  enable: false
  listen: :1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - "[2402:4e00::]"
    - "[2400:3200::1]"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
proxies:
  - name: MajsoulMax
    type: http
    server: 127.0.0.1
    port: 23410
    tls: true
proxy-groups:
  - name: Majsoul
    type: select
    proxies:
      - MajsoulMax
rules:
  - PROCESS-NAME,MajsoulMax.exe,DIRECT
  - PROCESS-NAME-REGEX,python.*?,DIRECT
  - PROCESS-NAME,Jantama_MahjongSoul.exe,Majsoul
  - PROCESS-NAME,雀魂麻將.exe,Majsoul
  - DOMAIN-KEYWORD,majsoul,Majsoul
  - DOMAIN-KEYWORD,maj-soul,Majsoul
  - DOMAIN-KEYWORD,mahjongsoul,Majsoul
  - DOMAIN-KEYWORD,catmjstudio,Majsoul
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - MATCH,DIRECT